<div class="flex flex-col h-screen bg-gray-100">

  <!-- HEADER / NAVBAR OSCURO -->
  <header class="flex items-center justify-between px-4 lg:px-6 py-3 bg-slate-800 border-b border-slate-700 shadow-lg z-30">
    
    <!-- Left Section: Logo + Toggle -->
    <div class="flex items-center space-x-4">
      <button
        class="p-2 rounded-lg text-slate-300 hover:bg-slate-700 hover:text-white focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all duration-200"
        (click)="toggleSidebar()"
      >
        <i class="pi text-xl" [ngClass]="sidebarOpen ? 'pi-times' : 'pi-bars'"></i>
      </button>
      
      <div class="flex items-center space-x-3">
        <div class="w-9 h-9 bg-gradient-to-br from-blue-500 to-blue-600 rounded-lg flex items-center justify-center shadow-md">
          <i class="pi pi-shield text-white text-sm"></i>
        </div>
        <div class="hidden sm:block">
          <h1 class="text-lg font-bold text-white">Acme Projects</h1>
          <p class="text-xs text-slate-400">Gestión de proyectos</p>
        </div>
      </div>
    </div>

    <!-- Right Section: User -->
    <div class="flex items-center space-x-2 lg:space-x-4 flex-shrink-0">

      <!-- User Menu -->
      <div class="relative">
        <button
          type="button"
          (click)="toggleUserMenu($event)"
          class="flex items-center space-x-3 px-3 py-2 rounded-lg hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all duration-200 group"
        >
          <div class="text-right hidden md:block leading-tight">
            <!-- Nombre: Blanco y negrita -->
            <p class="text-sm font-bold text-white truncate group-hover:text-blue-200 transition-colors">
              {{ currentUser?.nombre || 'Usuario' }} {{ currentUser?.apellidos || '' }}
            </p>
            <!-- Email: Gris claro -->
            <p class="text-xs text-slate-400 truncate opacity-80 group-hover:opacity-100 transition-opacity">
              {{ currentUser?.email || 'usuario@acme.com' }}
            </p>
          </div>
          
          <!-- Avatar: Fondo Blanco/Gris Claro, Texto Oscuro -->
          <p-avatar
            [label]="getInitials(currentUser)"
            styleClass="bg-slate-200 text-slate-800 font-bold border-2 border-slate-600 group-hover:border-blue-400 transition-colors"
            size="large"
            shape="circle">
          </p-avatar>
          
          <i class="pi pi-chevron-down text-slate-400 text-xs hidden md:block group-hover:text-white transition-colors"></i>
        </button>

        <p-menu #userMenu [model]="userMenuItems" [popup]="true" appendTo="body"></p-menu>
      </div>
    </div>
  </header>

  <div class="flex flex-1 overflow-hidden">

    <!-- Backdrop para móvil -->
    <div
      *ngIf="!isLargeScreen && sidebarOpen"
      class="fixed inset-0 bg-black/50 z-40 lg:hidden backdrop-blur-sm"
      (click)="toggleSidebar()"
    ></div>

    <!-- SIDEBAR OSCURO -->
    <aside
      class="bg-slate-800 border-r border-slate-700 shadow-xl flex flex-col transition-all duration-300 ease-in-out"
      [ngClass]="{
        'w-64': sidebarOpen,
        'w-0 lg:w-20': !sidebarOpen,
        'fixed h-full z-50': !isLargeScreen,
        'relative': isLargeScreen
      }"
    >
      <div class="flex-1 overflow-y-auto overflow-x-hidden custom-scrollbar" [ngClass]="{'px-3 py-4': sidebarOpen || isLargeScreen}">
        <nav>
          <ul class="space-y-1">
            
            <li *ngFor="let item of menuItems">
              
              <!-- Menú sin sub-items -->
              <a 
                 [routerLink]="item.route"
                 routerLinkActive="bg-blue-600 text-white shadow-md"
                 [routerLinkActiveOptions]="{exact: true}"
                 class="flex items-center px-3 py-3 rounded-lg text-slate-300 hover:bg-slate-700 hover:text-white transition-all duration-200 group"
                 (click)="!isLargeScreen ? toggleSidebar() : null"
                 [title]="!sidebarOpen && isLargeScreen ? (item.label || '') : ''"
              >
                <i [class]="item.icon || ''" class="text-lg" [ngClass]="{'mx-auto': !sidebarOpen && isLargeScreen}"></i>
                <span 
                  *ngIf="sidebarOpen || !isLargeScreen" 
                  class="ml-3 text-sm font-medium transition-opacity duration-200"
                >
                  {{ item.label }}
                </span>
              </a>
              
            </li>
          </ul>
        </nav>
      </div>

      <!-- Sidebar Footer -->
      <div 
        *ngIf="sidebarOpen || !isLargeScreen"
        class="p-4 border-t border-slate-700 bg-slate-900"
      >
        <div class="flex items-center space-x-3 text-xs text-slate-400">
          <div class="w-8 h-8 bg-slate-700 rounded-lg flex items-center justify-center">
            <i class="pi pi-info-circle text-slate-400"></i>
          </div>
          <div>
            <p class="font-semibold text-slate-300">v1.0.0</p>
            <p>© 2026 Acme Corp</p>
          </div>
        </div>
      </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="flex-1 bg-gray-50 overflow-y-auto relative">
      <!-- <app-loader></app-loader> -->
      <div class="p-4 lg:p-6">
        <router-outlet></router-outlet>
      </div>
    </main>
  </div>
</div>
